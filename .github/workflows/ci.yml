name: CI Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Setup Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Lint client
        run: cd client && npm run lint

      - name: Lint server
        run: cd server && npm run lint

      - name: Test client
        run: cd client && npm test -- --run

      - name: Test server (isolated in-memory DB)
        run: cd server && npm test

      - name: Security audit (client)
        run: node scripts/audit-gate.mjs client

      - name: Security audit (server)
        run: node scripts/audit-gate.mjs server

      - name: Build client
        run: cd client && npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: success()
        with:
          name: client-build
          path: client/dist/
          retention-days: 7
